<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Outer Dark Circular Chassis -->
  <circle cx="100" cy="100" r="96" fill="#090A0C" stroke="#2EE6CA" stroke-width="4" stroke-opacity="0.8" />

  <!-- Cyber Cyan Letter "P" Silhouette Body -->
  <path
    d="M48 24H128C158 24 176 42 176 72C176 102 158 120 128 120H96V176H48V24Z"
    fill="#2EE6CA"
  />

  <!-- Inner Counter cutout of the "P" -->
  <path
    d="M96 50H124C140 50 150 60 150 72C150 84 140 94 124 94H96V50Z"
    fill="#090A0C"
  />

  <!-- Sacred Geometry / 3D Octahedral Wireframe Structure in loop of P -->
  <g stroke="#2EE6CA" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main Octagon / Diamond bounds -->
    <polygon points="124,32 162,56 162,88 124,112 86,88 86,56" fill="#090A0C" fill-opacity="0.8" />

    <!-- Inner isometric projection cube/nodes -->
    <polygon points="124,46 148,62 148,82 124,98 100,82 100,62" fill="none" stroke-width="2" />

    <!-- Internal diagonal struts -->
    <line x1="124" y1="32" x2="124" y2="112" stroke-width="2.2" />
    <line x1="86" y1="56" x2="162" y2="88" stroke-width="1.8" />
    <line x1="86" y1="88" x2="162" y2="56" stroke-width="1.8" />
    <line x1="100" y1="62" x2="148" y2="82" stroke-width="1.5" stroke-dasharray="3 3" />
    <line x1="100" y1="82" x2="148" y2="62" stroke-width="1.5" stroke-dasharray="3 3" />

    <!-- Central node pulse point -->
    <circle cx="124" cy="72" r="5" fill="#2EE6CA" />
  </g>

  <!-- Bold "PAPA" Vertical Typography in Solid White -->
  <g fill="#FFFFFF" font-weight="900" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" letter-spacing="1">
    <text x="52" y="58" font-size="24">P</text>
    <text x="52" y="86" font-size="24">A</text>
    <text x="52" y="114" font-size="24">P</text>
    <text x="52" y="142" font-size="24">A</text>
  </g>

  <!-- Sub-label TATTOO SUPPLY vertical column -->
  <text
    x="77"
    y="166"
    fill="#090A0C"
    font-size="10"
    font-weight="800"
    letter-spacing="2"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    transform="rotate(-90 77 166)"
  >
    TATTOO SUPPLY
  </text>
</svg>
